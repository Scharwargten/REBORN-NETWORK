<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro - Reborn Network</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Fontes heroicas -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Bangers&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: 'Orbitron', sans-serif;
  
  /* Fundo temático */
  background: url("my-hero-academia-ipad-gnirzeeafueve157.jpg") no-repeat center center/cover;
  
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

/* Overlay escuro */
body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.75);
  z-index: 0;
}

/* Caixa heroica */
.cadastro-box {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  padding: 40px;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  border: 2px solid #ffcc00;
  box-shadow: 0 0 30px rgba(0, 150, 255, 0.7);
  animation: pulseGlow 3s infinite;
}

/* Animação de brilho */
@keyframes pulseGlow {
  0% { box-shadow: 0 0 20px rgba(0,150,255,0.5); }
  50% { box-shadow: 0 0 40px rgba(255,0,0,0.8); }
  100% { box-shadow: 0 0 20px rgba(0,150,255,0.5); }
}

/* Título */
.cadastro-box h2 {
  text-align: center;
  margin-bottom: 25px;
  font-family: 'Bangers', cursive;
  font-size: 2.2rem;
  color: #ffcc00;
  text-shadow: 0 0 15px #0096ff, 0 0 25px #ff0000;
}

/* Inputs */
.form-control {
  background: rgba(0,0,0,0.7);
  border: 1px solid #444;
  color: #fff;
}

.form-control:focus {
  border-color: #0096ff;
  box-shadow: 0 0 12px #0096ff;
  background: rgba(0,0,0,0.9);
  color: #fff;
}

/* Botão estilo Plus Ultra */
.btn-hero {
  background: linear-gradient(90deg, #ff0000, #ff8800, #ffcc00); /* vermelho → laranja → amarelo */
  color: #000;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 2px;
  border-radius: 10px;
  transition: 0.3s;
}

.btn-hero:hover {
  transform: scale(1.08);
  box-shadow: 0 0 25px #ff8800; /* brilho laranja */
}


/* Link */
a {
  color: #ffcc00;
  font-weight: bold;
}

a:hover {
  text-decoration: underline;
  color: #0096ff;
}
</style>
</head>

<body>

<div class="cadastro-box">
  <h2>Reborn Network</h2>
  <p class="text-center text-light mb-4">Junte-se à comunidade Plus Ultra!</p>

  <form action="cadastro.php" method="POST">
    <div class="mb-3">
      <label class="text-light">Nome</label>
      <input type="text" name="nome" class="form-control" placeholder="Digite seu nome" required>
    </div>

    <div class="mb-3">
      <label class="text-light">Email</label>
      <input type="email" name="email" class="form-control" placeholder="Digite seu email" required>
    </div>

    <div class="mb-3">
      <label class="text-light">Senha</label>
      <input type="password" name="senha" class="form-control" placeholder="Crie sua senha" required>
    </div>

     <div class="mb-3">
      <label class="text-light">Confirme sua senha</label>
      <input type="password" name="confirma_senha" class="form-control" placeholder="Confirme sua senha" required>
    </div>

    <button class="btn btn-hero w-100 mt-2">Cadastrar</button>

    <p class="mt-3 text-center text-light">
      Já tem conta? <a href="login.html">Entrar</a>
    </p>
  </form>
</div>

</body>
</html>
